  <path d="M22 21C41 32 54 41 60 53C66 65 60 75 73 82" stroke="url(#dnaStroke)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <path d="M34 28L62 43" stroke="url(#rungStroke)" stroke-width="4.2" stroke-linecap="round" opacity="0.92"/>
  <path d="M28 42L66 62" stroke="url(#rungStroke)" stroke-width="4.2" stroke-linecap="round" opacity="0.92"/>
  <path d="M31 61L56 75" stroke="url(#rungStroke)" stroke-width="4.2" stroke-linecap="round" opacity="0.92"/>
  <path d="M44 21L68 34" stroke="url(#rungStroke)" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>

  <circle cx="26" cy="72" r="3.2" fill="#ff5959"/>
  <circle cx="72" cy="17" r="3" fill="#ff9b8f"/>
